apiVersion: v1
kind: Pod
metadata:
  name: frontapp
  labels:
    homework: frontapp
    training: block3
spec:
  containers:
  - name: frontapp
    image: quay.io/drsylent/cubix/block3/homework-backapp:springboot4
    ports:
    - containerPort: 8080
    env:
    - name: APP_DEFAULT_MESSAGE
      value: "frontapp"
    - name: JAVA_OPTS
      value: ""
    - name: BACK_URL
      value: "http://backapp-service:8080"